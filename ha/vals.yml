nameOverride: ha
fullnameOverride: ha

image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: "latest"

service:
  ports:
  - port: 8123
    name: http

# hostNetwork: true
# dnsPolicy: ClusterFirstWithHostNet

env:
  - name: TZ
    value: "Europe/Oslo"

livenessProbe:
  httpGet:
    path: /static/icons/favicon.ico
    port: 8123
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /static/icons/favicon.ico
    port: 8123
  initialDelaySeconds: 5
  periodSeconds: 5
resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "50m"
    memory: "384Mi"

volumeMounts:
- name: ha-data
  mountPath: "/config"
  readOnly: false
- name: usb-zigbee
  mountPath: /dev/ttyUSB0
- name: config-volume
  mountPath: /config/configuration.yaml
  subPath: configuration.yaml
  readOnly: true
  
volumes:
- name: ha-data
  persistentVolumeClaim:
    claimName: ha-data
- name: usb-zigbee
  hostPath:
    path: /dev/ttyUSB0
    type: CharDevice
- name: config-volume
  configMap:
    name: ha-config

persistentVolumeClaimData:
- name: ha-data
  accessmode: ReadWriteOncePod
  request: 150Gi
  annotations:
    argocd.argoproj.io/sync-options: "Prune=false"

terminationGracePeriodSeconds: 50

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  readOnlyRootFilesystem: false
  capabilities:
      drop:
      - ALL
      # add:
      # - NET_ADMIN
      # - NET_RAW
      # - SYS_ADMIN
  
podSecurityContext:
  runAsUser: 50007
  runAsGroup: 50007
  fsGroup: 50007

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node.io/role
            operator: In
            values:
            - core
