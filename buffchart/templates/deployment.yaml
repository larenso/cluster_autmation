apiVersion: apps/v1
{{- if .Values.stateful }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "pichart.fullname" . }}
  labels: 
    {{- include "pichart.labels" . | nindent 4 }}
spec:
  {{- if .Values.stateful }}
  {{- $pvcs := list }}
  {{- range $x := .Values.volumes }}
  {{- if $x.persistentVolumeClaim }}{{- $pvcs = append $pvcs $x }}{{- end }}
  {{- end }}
  {{- with $pvcs }}
  volumeClaimTemplates:
    {{- range $x := . }}
    {{- $obj := include "pichart.findNameInArray" (dict "array" $.Values.persistentVolumeClaimData "keyword" $x.name) | fromYaml }}
    {{- if not $obj }}{{ fail (printf "no persistentVolumeClaimData entry for %q" $x.name) }}{{- end }}
  - metadata:
      name: {{ $x.persistentVolumeClaim.claimName }}
      labels:
        {{- include "pichart.labelsNoVersion" $ | nindent 8 }}
      {{- with $obj.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      accessModes:
      - {{ $obj.accessmode | default "ReadWriteOnce" }}
      storageClassName: local-path
      resources:
        requests:
          storage: {{ $obj.request | default "1Gi" }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if hasKey .Values "revisionHistoryLimit" }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- else }}
  revisionHistoryLimit: 1
  {{- end }}
  {{- if .Values.rollingUpdate }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ dig "maxSurge" 1 .Values.rollingUpdate }}
      maxUnavailable: {{ dig "maxUnavailable" 1 .Values.rollingUpdate }}
  {{- else if not .Values.stateful }}
  strategy: 
    type: Recreate
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels: 
      {{- include "pichart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 6 }}
      {{- end }}
      labels:
        {{- include "pichart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "pichart.serviceAccountName" . }}
      automountServiceAccountToken: {{ (.Values.serviceAccount).automount | default false }}
      {{- with .Values.podSecurityContext }}
      securityContext: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostNetwork }}
      hostNetwork: {{ . }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      containers:
      - name: {{ include "pichart.fullname" . }}
        {{- with .Values.securityContext }}
        securityContext: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required (set image.tag or chart appVersion)" (default .Chart.AppVersion .Values.image.tag) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        {{- range $i := .Values.service.ports }}
        {{- $tp := $i.targetPort }}
        - containerPort: {{ or ($tp | int) $i.port | required "service.ports entries need a numeric port (or numeric targetPort)" }}
          {{- if and $tp (not ($tp | int)) }}
          name: {{ $tp }}
          {{- end }}
        {{- end }}
        {{- with .Values.env }}
        env: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.args }}
        args: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.cmd }}
        command: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        volumeMounts: 
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- range $k, $v := .Values.sidecars }}
      - name: {{ $k }}
        image: "{{ required (printf "sidecars.%s.image is required" $k) $v.image }}:{{ required (printf "sidecars.%s.tag is required" $k) $v.tag }}"
        {{- $map := dict "securityContext" $.Values.securityContext }}
        {{- merge (dict) ($v.params | default dict) $map  | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.volumes }}
      volumes: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
