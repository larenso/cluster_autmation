apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ha-egress
  namespace: apps
  labels:
    network-policy-set: 30-ha
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ha
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
