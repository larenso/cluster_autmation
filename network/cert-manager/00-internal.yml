apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-k8sapi
  namespace: cert-manager
  labels:
    network-policy-set: 00-internal
spec:
  endpointSelector: {}
  egress:
    - toEntities: ["host", "remote-node"]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
