commonLabels: 
  app.kubernetes.io/version: v1.19.4

k8sServiceHost: 192.168.1.3
k8sServicePort: 6443

# force clean state
# cleanState: true

cluster:
  name: default
  id: 0

ipv4:
  enabled: true
ipv6:
  enabled: false

ipv4NativeRoutingCIDR: 10.100.0.0/24
# ipv6NativeRoutingCIDR: fd00::0/112
# enableIPv6Masquerade: false

devices: "wlan0"

ipam:
  mode: "cluster-pool"
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.100.0.0/24
    # clusterPoolIPv6PodCIDRList:
    #   - fd00::0/112
    clusterPoolIPv4MaskSize: 24
    # clusterPoolIPv6MaskSize: 112

# nodes routing
routingMode: "native"
autoDirectNodeRoutes: true

kubeProxyReplacement: true
bpf:
  masquerade: true
  datapathMode: "netkit"
  # hostLegacyRouting: true
  distributedLRU:
    enabled: false
# bpfClockProbe: true
annotateK8sNode: true
rollOutCiliumPods: true

ciliumEndpointSlice:
  enabled: true
endpointHealthChecking:
  enabled: true
bandwidthManager:
  enabled: false
nat46x64Gateway:
  enabled: false
l2announcements:
  enabled: false
l2podAnnouncements:
  enabled: false
pmtuDiscovery:
  enabled: false
nodeIPAM:
  enabled: false

gatewayAPI:
  enabled: true
  enableAppProtocol: true
  enableAlpn: true
  secretsNamespace:
    create: false
    name: kube-system
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        node.io/role: core

tls:
  secretsNamespace:
    create: false
    name: kube-system
  caBundle:
    useSecret: true

envoyConfig:
  secretsNamespace:
    create: false
    name: kube-system

enableLBIPAM: false
certgen:
  generateCA: false

# authentication:
#   enabled: true
#   mutual:
#     spire:
#       enabled: true
#       install:
#         enabled: true

encryption:
  enabled: true
  type: "wireguard"
  nodeEncryption: false

resources:
  limits:
    cpu: 500m
    memory: 384Mi
  requests:
    cpu: 30m
    memory: 192Mi

operator:
  replicas: 1
  resources:
    limits:
      cpu: 50m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 64Mi
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false

envoy:
  enabled: true
  log:
    format: null
    format_json:
      date: "%Y-%m-%dT%T.%e"
      thread_id: "%t"
      source_line: "%s:%#"
      level: "%l"
      logger: "%n"
      message: "%j"
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - SYS_ADMIN

hubble:
  enabled: false
  relay:
    enabled: false
    resources: {}
  ui:
    enabled: false
    tls:
      client:
        existingSecret: ""
    backend:
      resources: {}
    frontend:
      resources: {}
  tls:
    auto:
      method: certmanager
      certValidityDuration: 90
      certManagerIssuerRef:
        name: cluster-private
        group: cert-manager.io
        kind: ClusterIssuer

cgroup:
  autoMount:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
